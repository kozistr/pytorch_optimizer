name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate
        type: string
        required: false
        default: ''
      skip_coverage_upload:
        description: Skip coverage uploads during release validation
        type: boolean
        required: false
        default: false

env:
  OMP_NUM_THREADS: 8
  MKL_NUM_THREADS: 8
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.12
          enable-cache: true
          prune-cache: false

      - name: Install dependencies
        run: uv sync --frozen --no-editable

      - name: Run lint
        run: |
          uv run ruff check pytorch_optimizer examples tests scripts hubconf.py

  type_check:
    name: Static Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.12
          enable-cache: true
          prune-cache: false

      - name: Install dependencies
        run: uv sync --frozen --no-editable

      - name: Run type check
        run: uv run --frozen ty check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: 3.12
          enable-cache: true

      - name: Build documentation
        run: uv run --no-project --python 3.12 --with-requirements docs/requirements-docs.txt zensical build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}

    - name: Setup uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        prune-cache: false

    - name: Install dependencies
      run: uv sync --frozen --no-editable

    - name: Check test
      run: uv run --frozen pytest

    - name: Upload coverage
      if: success() && !inputs.skip_coverage_upload
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./
        files: ./coverage.xml
        env_vars: OS,PYTHON
        flags: ${{ matrix.python-version }}
        fail_ci_if_error: true
        verbose: false

  ci-summary:
    if: always()
    needs: [lint, type_check, docs, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: Report Summary
        run: echo "✅ Lint, documentation, and tests completed for all targets"
