name: Release
run-name: Release / ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        type: choice
        default: patch
        options: [major, minor, patch]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  guard:
    name: Guard Release Ref
    runs-on: ubuntu-latest
    steps:
      - name: Require main for manual releases
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo "Run manual releases from main, not $GITHUB_REF" >&2
            exit 1
          fi

  validate:
    name: Validate
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}
      skip_coverage_upload: true

  prepare:
    name: Prepare Version
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.commit.outputs.ref }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'

      - name: Validate and bump package version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import tomllib
          from pathlib import Path

          project = Path('pyproject.toml')
          text = project.read_text(encoding='utf-8')
          current = tomllib.loads(text)['project']['version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', current):
              raise ValueError('Package version must have the form MAJOR.MINOR.PATCH')

          lock = tomllib.loads(Path('uv.lock').read_text(encoding='utf-8'))
          package = next(package for package in lock['package'] if package['name'] == 'pytorch-optimizer')
          if package['version'] != current:
              raise ValueError('uv.lock version does not match pyproject.toml')

          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              parts = list(map(int, current.split('.')))
              index = {'major': 0, 'minor': 1, 'patch': 2}[os.environ['BUMP']]
              parts[index] += 1
              parts[index + 1:] = [0] * (2 - index)
              version = '.'.join(map(str, parts))
              project.write_text(text.replace(f'version = "{current}"', f'version = "{version}"', 1), encoding='utf-8')
              tag = f'v{version}'
          else:
              tag = os.environ['GITHUB_REF_NAME']
              if tag != f'v{current}':
                  raise ValueError(f'Tag {tag} does not match package version {current}')

          print(f'tag={tag}')
          PY

      - name: Commit and push version bump
        id: commit
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
              echo "Tag $RELEASE_TAG already exists" >&2
              exit 1
            fi
            uv lock
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pyproject.toml uv.lock
            git commit -m "build: prepare version ${RELEASE_TAG#v} [skip ci]"
            git push origin HEAD:main
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Publish Package
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'

      - name: Build package
        run: uv build

      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REF: ${{ needs.prepare.outputs.ref }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$RELEASE_REF" ]]; then
              echo "Tag $RELEASE_TAG points to a different commit" >&2
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" -m "pytorch-optimizer $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish package to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    permissions:
      contents: write
    steps:
      - name: Generate release notes and create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          name: pytorch-optimizer ${{ needs.prepare.outputs.tag }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.ref }}
          token: ${{ secrets.GH_TOKEN }}

  changelog:
    name: Update Changelogs
    runs-on: ubuntu-latest
    needs: [prepare, release]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Update changelogs from the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          python scripts/update_changelog.py "$RELEASE_TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Create changelog pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: docs/changelog-update-${{ needs.prepare.outputs.tag }}
          commit-message: 'docs: update changelogs for ${{ needs.prepare.outputs.tag }}'
          title: 'docs: update changelogs for ${{ needs.prepare.outputs.tag }}'
          body: >-
            Sync the generated release notes from
            https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
            into CHANGELOG.md and the documentation.
          base: main
          add-paths: |
            CHANGELOG.md
            docs/changelogs/${{ needs.prepare.outputs.tag }}.md
            docs/changelogs/index.md
          delete-branch: true
          labels: automerge
          token: ${{ secrets.GH_TOKEN }}
